# Example nginx config for fronting auth_api.py with TLS.
#
# Usage:
#   1. Get a TLS cert (Let's Encrypt / certbot recommended):
#        sudo certbot --nginx -d api.example.com
#   2. Put this file in /etc/nginx/sites-available/codex-auth-api
#      symlink into /etc/nginx/sites-enabled/, then `nginx -s reload`.
#   3. auth_api.py runs on 127.0.0.1:8788, NEVER exposed directly.
#
# Production hardening: rate-limit at nginx level too, ban IPs with fail2ban
# on repeated 401s, require client certs (mTLS) for the highest security
# tier, log request bodies to nothing (don't accidentally store keys).

# Sane defaults — rate-limit zone (10 req/s per IP, burst 30)
limit_req_zone $binary_remote_addr zone=codex_api:10m rate=10r/s;

server {
    listen 80;
    server_name api.example.com;
    # ACME http-01 challenge — keep this if you renew with certbot --webroot
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # TLS (let certbot fill these in; below are typical paths)
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # security headers (auth_api also sets HSTS / no-store etc.)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # no big bodies — API only receives bearer headers
    client_max_body_size 64k;
    client_body_timeout 10s;

    # do NOT log full request line (it could include the Authorization header
    # if it ever leaks via a misbehaving client) — keep only method, URI, status
    log_format codex_audit '$remote_addr - $request_method $uri '
                          '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/codex-api.log codex_audit;
    error_log  /var/log/nginx/codex-api.err warn;

    # nginx-level rate limit (in addition to per-key limit inside auth_api)
    limit_req zone=codex_api burst=30 nodelay;
    limit_req_status 429;

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # not $proxy_add_x_forwarded_for to prevent client-supplied spoofing
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering off;          # streaming-friendly; auth.json is small anyway
    }

    # only the documented endpoints exist — explicitly 404 anything else,
    # so probing /admin /console /.env etc. doesn't even reach the app
    location ~ ^/(?!v1/) {
        return 404;
    }
}
